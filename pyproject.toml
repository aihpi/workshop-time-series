[project]
name = "kisz-time-series"
version = "1.0.0"
description = "Code and resources for the OpenHPI course Time Series Analysis and Forecasting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.16.4",
    "iprogress>=0.4",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
    "missingno>=0.5.2",
    "pandas>=2.3.2",
    "pip>=25.2",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "statsmodels>=0.14.5",
]

[tool.uv]
package = true
# The dev group holds authoring tools only, so `uv sync` gives course
# participants exactly the packages the notebooks need. Contributors get the
# rest with `uv sync --group dev`.
default-groups = []

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]

