[project]
name = "kisz-time-series"
version = "1.0.0"
description = "Code and resources for the OpenHPI course Time Series Analysis and Forecasting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.16.4",
    "iprogress>=0.4",
    "ipykernel>=6.30.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.6",
    "missingno>=0.5.2",
    "pandas>=2.3.2",
    "pip>=25.2",
    "pyarrow>=21.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "statsmodels>=0.14.5",
    # xgboost-cpu is the same library without the CUDA runtime, which saves
    # roughly 290 MB on a course nobody runs on a GPU. It ships no macOS
    # wheels, and the regular package has no CUDA dependency there anyway, so
    # macOS gets that one. Both import as `xgboost`.
    "xgboost>=3.4.1 ; sys_platform == 'darwin'",
    "xgboost-cpu>=3.4.1 ; sys_platform != 'darwin'",
]

[tool.uv]
package = true
# The groups below hold authoring tools and large single-use extras, so that a
# plain `uv sync` gives course participants exactly the packages the notebooks
# need and nothing more. Opt in with `uv sync --group dev` or `--group advanced`.
default-groups = []

# PyTorch publishes CUDA-enabled wheels on PyPI for Linux and Windows, which
# pull in well over 2 GB of NVIDIA runtime. This course is CPU-only, so those
# two platforms take the CPU build from PyTorch's own index. macOS wheels on
# PyPI are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[dependency-groups]
advanced = [
    "prophet>=1.4.0",
]
dl = [
    "neuralforecast>=3.2.2",
    "torch>=2.6.0",
]
dev = [
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
]

